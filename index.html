<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Names</title>
<meta name="description" content="Flashcards for learning students' names from their faces.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙂</text></svg>">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --ink: #1f2328;
    --muted: #6b6f76;
    --line: #e2ded5;
    --accent: #3a5a99;
    --good: #1f8a4c;
    --good-soft: #e3f4ea;
    --bad: #c8372d;
    --bad-soft: #fbe6e4;
    --tip: #fff6d6;
    --tip-ink: #6a5200;
    --shadow: 0 10px 30px rgba(30, 30, 40, .12), 0 2px 6px rgba(30, 30, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b;
      --surface: #1f2228;
      --ink: #eceef1;
      --muted: #9aa0a8;
      --line: #30343c;
      --accent: #8fb0f0;
      --good: #47c27a;
      --good-soft: #1a3326;
      --bad: #f06a5f;
      --bad-soft: #3a1f1d;
      --tip: #3a3218;
      --tip-ink: #f3dc8c;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b; --surface: #1f2228; --ink: #eceef1; --muted: #9aa0a8; --line: #30343c;
    --accent: #8fb0f0; --good: #47c27a; --good-soft: #1a3326; --bad: #f06a5f; --bad-soft: #3a1f1d;
    --tip: #3a3218; --tip-ink: #f3dc8c; --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 0;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tab {
    border: 1px solid var(--line);
    background: transparent;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 14px;
    white-space: nowrap;
    color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  main {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .status {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .progress { color: var(--muted); font-size: 14px; }
  .bins { display: flex; gap: 14px; }
  .bin {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 22px;
    line-height: 1;
  }
  .bin small {
    font-size: 14px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    min-width: 1ch;
  }
  .bin.learned small { color: var(--good); }
  .bin.learning small { color: var(--bad); }
  .bin.bump { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.3); } }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
  }
  .side {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 96px;
    padding: 14px 6px;
    border-radius: 18px;
    border: 2px solid currentColor;
    background: var(--surface);
    font-weight: 650;
    font-size: 15px;
  }
  .side .icon { font-size: 30px; line-height: 1; }
  .side kbd { font: 12px/1 ui-monospace, monospace; color: var(--muted); }
  .side.wrong { color: var(--bad); }
  .side.correct { color: var(--good); }
  .side.wrong:hover { background: var(--bad-soft); }
  .side.correct:hover { background: var(--good-soft); }
  .side:disabled { opacity: .35; cursor: default; }

  .deck {
    position: relative;
    width: min(400px, 100%, 52svh);
    aspect-ratio: 4 / 5;
    flex: 0 1 auto;
  }
  .card {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    will-change: transform;
  }
  .card.dragging { cursor: grabbing; }
  .card.enter { animation: enter .25s ease-out; }
  @keyframes enter { from { transform: scale(.94); opacity: 0; } }
  .card .backdrop {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(18px) brightness(.8);
  }
  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .stamp {
    position: absolute;
    top: 18px;
    padding: 4px 12px;
    border: 3px solid currentColor;
    border-radius: 10px;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: .04em;
    background: rgba(255, 255, 255, .85);
    opacity: 0;
    pointer-events: none;
  }
  .stamp.yes { left: 16px; color: #1f8a4c; transform: rotate(-12deg); }
  .stamp.no { right: 16px; color: #c8372d; transform: rotate(12deg); }

  .name {
    margin-top: 14px;
    min-height: 1.4em;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
  }
  .name.hidden { color: var(--muted); font-weight: 500; font-size: 15px; display: flex; align-items: center; }

  .tools { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .pill {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 9px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 15px;
  }
  .pill:hover { border-color: var(--muted); }
  .pill kbd { font: 12px/1 ui-monospace, monospace; color: var(--muted); margin-left: 4px; }
  .tip {
    margin-top: 12px;
    max-width: 440px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--tip);
    color: var(--tip-ink);
    text-align: center;
  }

  .done {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
  }
  .done .big { font-size: 64px; line-height: 1; }
  .done h2 { margin: 0; font-size: 24px; }
  .done p { margin: 0; color: var(--muted); }
  .primary {
    margin-top: 8px;
    border: 0;
    background: var(--accent);
    color: var(--bg);
    padding: 11px 20px;
    border-radius: 999px;
    font-weight: 650;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px max(14px, env(safe-area-inset-bottom));
    color: var(--muted);
    font-size: 13px;
  }
  .link { border: 0; background: none; padding: 4px 0; color: var(--muted); text-decoration: underline; font-size: 13px; }
  .link:disabled { opacity: .4; cursor: default; }
  .keys-touch { display: none; }

  @media (max-width: 620px) {
    header h1 { display: none; }
    /* Full-width photo; Wrong/Correct sit beneath it, still left and right. */
    .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .deck { grid-column: 1 / -1; order: -1; justify-self: center; width: min(100%, 52svh); }
    .side { width: auto; flex-direction: row; justify-content: center; gap: 8px; padding: 10px; border-radius: 14px; }
    .side .icon { font-size: 22px; }
    .side kbd { display: none; }
    .name { font-size: 24px; }
  }
  @media (hover: none) and (pointer: coarse) {
    .keys-desktop, .pill kbd { display: none; }
    .keys-touch { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.enter, .bin.bump { animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Student Names</h1>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Classes"></nav>
</header>

<main>
  <div class="status">
    <div class="progress" id="progress"></div>
    <div class="bins">
      <span class="bin learned" id="binLearned" title="Learned">✅<small id="countLearned">0</small></span>
      <span class="bin learning" id="binLearning" title="Learning">❌<small id="countLearning">0</small></span>
    </div>
  </div>

  <div class="stage">
    <button class="side wrong" id="btnWrong" aria-label="Wrong (left arrow)">
      <span class="icon">✗</span>Wrong<kbd>←</kbd>
    </button>
    <div class="deck" id="deck"></div>
    <button class="side correct" id="btnCorrect" aria-label="Correct (right arrow)">
      <span class="icon">✓</span>Correct<kbd>→</kbd>
    </button>
  </div>

  <div class="name hidden" id="name" aria-live="polite"></div>
  <div class="tools" id="tools">
    <button class="pill" id="btnReveal">Reveal name<kbd>Space</kbd></button>
    <button class="pill" id="btnTip">💡 Tip<kbd>T</kbd></button>
  </div>
  <div class="tip" id="tip" hidden></div>
</main>

<footer>
  <span>
    <span class="keys-desktop">← Wrong · → Correct · Space reveal · T tip · Z undo</span>
    <span class="keys-touch">Swipe right if you knew it, left if you didn’t. Tap the photo to reveal.</span>
  </span>
  <span>
    <button class="link" id="btnUndo" disabled>Undo</button>
    ·
    <button class="link" id="btnReset">Start over</button>
  </span>
</footer>

<script src="classes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
(() => {
  const CLASSES = window.CLASSES || [];
  const $ = (id) => document.getElementById(id);
  const els = {
    tabs: $("tabs"), progress: $("progress"), deck: $("deck"), name: $("name"),
    tip: $("tip"), tools: $("tools"), countLearned: $("countLearned"), countLearning: $("countLearning"),
    binLearned: $("binLearned"), binLearning: $("binLearning"),
    btnWrong: $("btnWrong"), btnCorrect: $("btnCorrect"), btnReveal: $("btnReveal"),
    btnTip: $("btnTip"), btnUndo: $("btnUndo"), btnReset: $("btnReset"),
  };

  let cls = null;        // current class
  let state = null;      // { round, queue, learned, learning }
  let history = [];      // snapshots for undo
  let busy = false;      // true while a card is flying away
  let revealed = false;

  // ---------- storage (best effort) ----------
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const key = () => "names:" + cls.id;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function freshState() {
    return { round: 1, queue: shuffle(cls.students.map((_, i) => i)), learned: [], learning: [] };
  }

  function loadState() {
    const s = store.get(key());
    const n = cls.students.length;
    const ok = s && Array.isArray(s.queue) && Array.isArray(s.learned) && Array.isArray(s.learning)
      && s.rosterSize === n
      && [...s.queue, ...s.learned, ...s.learning].every((i) => Number.isInteger(i) && i >= 0 && i < n);
    return ok ? s : freshState();
  }

  function save() { store.set(key(), { ...state, rosterSize: cls.students.length }); }

  // ---------- tabs ----------
  function renderTabs() {
    els.tabs.innerHTML = "";
    CLASSES.forEach((c) => {
      const b = document.createElement("button");
      b.className = "tab";
      b.role = "tab";
      b.textContent = c.name;
      b.setAttribute("aria-selected", String(c === cls));
      b.onclick = () => { location.hash = c.id; };
      els.tabs.appendChild(b);
    });
  }

  function selectFromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    const next = CLASSES.find((c) => c.id === id) || CLASSES[0];
    if (!next) return;
    if (next === cls) return;
    cls = next;
    state = loadState();
    history = [];
    document.title = cls.name + " · Student Names";
    renderTabs();
    render(true);
  }

  // ---------- rendering ----------
  const photoUrl = (s) => "photos/" + cls.id + "/" + s.photo;

  function renderCounts() {
    els.countLearned.textContent = state.learned.length;
    els.countLearning.textContent = state.learning.length;
  }

  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function render(animate) {
    renderCounts();
    els.btnUndo.disabled = history.length === 0;
    revealed = false;
    els.tip.hidden = true;
    els.deck.innerHTML = "";

    const done = state.queue.length === 0;
    els.btnWrong.disabled = els.btnCorrect.disabled = done;
    els.tools.style.visibility = done ? "hidden" : "";

    if (done) {
      els.progress.textContent = "";
      els.name.className = "name hidden";
      els.name.textContent = "";
      const d = document.createElement("div");
      d.className = "done";
      d.innerHTML = `<div class="big">🎉</div><h2>All ${cls.students.length} learned!</h2>
        <p>You got everyone in ${state.round} ${state.round === 1 ? "round" : "rounds"}.</p>
        <button class="primary">Practice again</button>`;
      d.querySelector("button").onclick = reset;
      els.deck.appendChild(d);
      return;
    }

    const left = state.queue.length;
    els.progress.textContent = (state.round === 1 ? "First pass" : "Review round " + state.round) +
      " · " + left + " left";

    const s = cls.students[state.queue[0]];
    const card = document.createElement("div");
    card.className = "card" + (animate ? " enter" : "");
    card.innerHTML = `<div class="backdrop"></div><img alt="Student photo" draggable="false">
      <div class="stamp yes">KNEW IT</div><div class="stamp no">NOPE</div>`;
    card.querySelector(".backdrop").style.backgroundImage = `url("${photoUrl(s)}")`;
    card.querySelector("img").src = photoUrl(s);
    els.deck.appendChild(card);
    attachSwipe(card);

    els.name.className = "name hidden";
    els.name.textContent = "Who is this?";
    els.tip.textContent = s.tip || "No tip for this student.";
    els.btnReveal.firstChild.textContent = "Reveal name";

    // Preload the next face.
    if (state.queue[1] != null) new Image().src = photoUrl(cls.students[state.queue[1]]);
  }

  function reveal(toggle = true) {
    if (!state.queue.length) return;
    revealed = toggle ? !revealed : true;
    const s = cls.students[state.queue[0]];
    els.name.className = revealed ? "name" : "name hidden";
    els.name.textContent = revealed ? s.name : "Who is this?";
    els.btnReveal.firstChild.textContent = revealed ? "Hide name" : "Reveal name";
  }

  function toggleTip() {
    if (!state.queue.length) return;
    els.tip.hidden = !els.tip.hidden;
  }

  // ---------- core logic ----------
  function mark(correct) {
    if (busy || !state.queue.length) return;
    history.push(JSON.parse(JSON.stringify(state)));
    if (history.length > 100) history.shift();

    const id = state.queue.shift();
    if (correct) {
      state.learning = state.learning.filter((x) => x !== id);
      if (!state.learned.includes(id)) state.learned.push(id);
      bump(els.binLearned);
    } else {
      if (!state.learning.includes(id)) state.learning.push(id);
      bump(els.binLearning);
    }

    let finished = false;
    if (!state.queue.length) {
      if (state.learning.length) {
        // Start the next pass through the Learning bin, in a new random order,
        // without showing the same face twice in a row.
        state.round += 1;
        let q = shuffle(state.learning);
        if (q.length > 1 && q[0] === id) [q[0], q[1]] = [q[1], q[0]];
        state.queue = q;
      } else {
        finished = true;
      }
    }
    save();
    flyOut(correct, () => {
      render(true);
      if (finished) celebrate();
    });
  }

  function undo() {
    if (busy || !history.length) return;
    state = history.pop();
    save();
    render(true);
  }

  function reset() {
    state = freshState();
    history = [];
    save();
    render(true);
  }

  function celebrate() {
    if (typeof confetti !== "function") return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
      return;
    }
    const end = Date.now() + 1800;
    confetti({ particleCount: 160, spread: 100, origin: { y: 0.6 } });
    (function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 60, origin: { x: 0, y: 0.7 } });
      confetti({ particleCount: 5, angle: 120, spread: 60, origin: { x: 1, y: 0.7 } });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  // ---------- card motion & swiping ----------
  function setStamps(card, dx) {
    const t = Math.min(Math.abs(dx) / 100, 1);
    card.querySelector(".stamp.yes").style.opacity = dx > 0 ? t : 0;
    card.querySelector(".stamp.no").style.opacity = dx < 0 ? t : 0;
  }

  function flyOut(correct, after) {
    const card = els.deck.querySelector(".card");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!card || reduce) { after(); return; }
    busy = true;
    const dir = correct ? 1 : -1;
    setStamps(card, dir * 100);
    card.style.transition = "transform .28s ease-in, opacity .28s ease-in";
    card.style.transform = `translateX(${dir * 140}%) rotate(${dir * 18}deg)`;
    card.style.opacity = "0";
    setTimeout(() => { busy = false; after(); }, 260);
  }

  function attachSwipe(card) {
    let startX = 0, startY = 0, dx = 0, startT = 0, active = false, horizontal = null, pid = null;

    card.addEventListener("pointerdown", (e) => {
      if (busy || (e.pointerType === "mouse" && e.button !== 0)) return;
      active = true; horizontal = null; dx = 0; pid = e.pointerId;
      startX = e.clientX; startY = e.clientY; startT = performance.now();
      card.style.transition = "none";
    });

    card.addEventListener("pointermove", (e) => {
      if (!active || e.pointerId !== pid) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (horizontal === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        horizontal = Math.abs(mx) > Math.abs(my);
        if (horizontal) { card.setPointerCapture(pid); card.classList.add("dragging"); }
        else { active = false; return; }
      }
      if (!horizontal) return;
      dx = mx;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      setStamps(card, dx);
    });

    const finish = (e) => {
      if (!active || e.pointerId !== pid) return;
      active = false;
      card.classList.remove("dragging");
      if (horizontal === null) return; // a tap; the click handler reveals the name
      const speed = Math.abs(dx) / Math.max(performance.now() - startT, 1);
      const threshold = Math.min(110, card.offsetWidth * 0.3);
      if (Math.abs(dx) > threshold || (Math.abs(dx) > 40 && speed > 0.6)) {
        mark(dx > 0);
      } else {
        card.style.transition = "transform .2s ease-out";
        card.style.transform = "";
        setStamps(card, 0);
      }
    };
    card.addEventListener("pointerup", finish);
    card.addEventListener("click", () => { if (!horizontal && !busy) reveal(); });
    card.addEventListener("pointercancel", (e) => {
      if (!active) return;
      active = false;
      card.classList.remove("dragging");
      card.style.transition = "transform .2s ease-out";
      card.style.transform = "";
      setStamps(card, 0);
    });
  }

  // ---------- controls ----------
  // Mouse clicks shouldn't leave buttons focused, so Space keeps meaning "reveal".
  const click = (el, fn) => el.addEventListener("click", (e) => { if (e.detail) el.blur(); fn(); });
  click(els.btnWrong, () => mark(false));
  click(els.btnCorrect, () => mark(true));
  click(els.btnReveal, () => reveal());
  click(els.btnTip, toggleTip);
  click(els.btnUndo, undo);
  click(els.btnReset, () => { if (confirm("Start this class over? Both bins will be emptied.")) reset(); });

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onButton = e.target instanceof HTMLButtonElement;
    if (onButton && (e.key === " " || e.key === "Enter")) return;
    switch (e.key) {
      case "ArrowRight": e.preventDefault(); mark(true); break;
      case "ArrowLeft": e.preventDefault(); mark(false); break;
      case " ": e.preventDefault(); reveal(); break;
      case "t": case "T": toggleTip(); break;
      case "z": case "Z": case "Backspace": undo(); break;
    }
  });

  window.addEventListener("hashchange", selectFromHash);
  selectFromHash();
})();
</script>
</body>
</html>
